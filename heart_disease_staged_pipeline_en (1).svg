<svg width="680" viewBox="0 0 680 800" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Cleveland dataset -->
<rect x="190" y="20" width="300" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="340" y="44" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">Cleveland dataset (UCI)</text>
<text x="340" y="63" text-anchor="middle" font-size="12" fill="#5F5E5A">Tabular, binary target condition</text>
<line x1="340" y1="76" x2="340" y2="104" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- QC + EDA -->
<rect x="190" y="104" width="300" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="128" text-anchor="middle" font-size="14" font-weight="500" fill="#0C447C">Quality control + EDA</text>
<text x="340" y="147" text-anchor="middle" font-size="12" fill="#185FA5">No NaN/dupes, balance, correlations</text>
<line x1="340" y1="160" x2="340" y2="188" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- 4 clinical stages container -->
<rect x="100" y="188" width="480" height="92" rx="14" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="210" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">4 incremental clinical stages</text>
<rect x="118" y="224" width="105" height="44" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<text x="170" y="242" text-anchor="middle" font-size="12" font-weight="500" fill="#04342C">Stage 1</text>
<text x="170" y="258" text-anchor="middle" font-size="11" fill="#085041">CV risk factors</text>
<rect x="231" y="224" width="105" height="44" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<text x="283" y="242" text-anchor="middle" font-size="12" font-weight="500" fill="#04342C">Stage 2</text>
<text x="283" y="258" text-anchor="middle" font-size="11" fill="#085041">+ symptoms/ECG</text>
<rect x="344" y="224" width="105" height="44" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<text x="396" y="242" text-anchor="middle" font-size="12" font-weight="500" fill="#04342C">Stage 3</text>
<text x="396" y="258" text-anchor="middle" font-size="11" fill="#085041">+ stress test</text>
<rect x="457" y="224" width="105" height="44" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<text x="509" y="242" text-anchor="middle" font-size="12" font-weight="500" fill="#04342C">Stage 4</text>
<text x="509" y="258" text-anchor="middle" font-size="11" fill="#085041">+ ca, thal</text>
<line x1="340" y1="280" x2="340" y2="308" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Locked split -->
<rect x="190" y="308" width="300" height="56" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="340" y="332" text-anchor="middle" font-size="14" font-weight="500" fill="#633806">Locked split 80 / 20</text>
<text x="340" y="351" text-anchor="middle" font-size="12" fill="#854F0B">Development set vs locked test set</text>
<line x1="340" y1="364" x2="340" y2="392" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Nested CV outer container -->
<rect x="100" y="392" width="480" height="160" rx="14" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="340" y="414" text-anchor="middle" font-size="14" font-weight="500" fill="#4A1B0C">Nested cross-validation (development set)</text>
<text x="340" y="432" text-anchor="middle" font-size="12" fill="#993C1D">Pipeline: impute + scale + one-hot → model (leakage-safe)</text>

<!-- Outer loop -->
<rect x="130" y="446" width="420" height="44" rx="8" fill="#F4C0D1" stroke="#993556" stroke-width="0.5"/>
<text x="340" y="464" text-anchor="middle" font-size="13" font-weight="500" fill="#4B1528">Outer loop — generalisation estimate</text>
<text x="340" y="481" text-anchor="middle" font-size="11" fill="#72243E">ROC-AUC, Logistic Regression vs Random Forest</text>

<!-- Inner loop -->
<rect x="165" y="498" width="350" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="516" text-anchor="middle" font-size="13" font-weight="500" fill="#26215C">Inner loop — GridSearchCV</text>
<text x="340" y="533" text-anchor="middle" font-size="11" fill="#3C3489">Hyperparameter tuning per outer fold</text>

<line x1="340" y1="552" x2="340" y2="580" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Strategy selection -->
<rect x="190" y="580" width="300" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="604" text-anchor="middle" font-size="14" font-weight="500" fill="#26215C">Strategy selection</text>
<text x="340" y="623" text-anchor="middle" font-size="12" fill="#3C3489">Best stage + model + threshold on dev</text>
<line x1="340" y1="636" x2="340" y2="664" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Final evaluation -->
<rect x="120" y="664" width="440" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="340" y="688" text-anchor="middle" font-size="14" font-weight="500" fill="#173404">Final evaluation on locked test set</text>
<text x="340" y="707" text-anchor="middle" font-size="12" fill="#27500A">ROC-AUC + CI, sens/spec, Brier, confusion matrix, per stage</text>
<line x1="340" y1="720" x2="340" y2="748" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- SHAP -->
<rect x="190" y="748" width="300" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="775" text-anchor="middle" font-size="14" font-weight="500" fill="#0C447C">SHAP — interpretability</text>

</svg>
